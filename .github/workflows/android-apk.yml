name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        run: |
          mkdir -p hanako_nana_calculator/app/src/main/assets
          mkdir -p hanako_nana_calculator/app/src/main/res/values
          cp hanako_nana_calculator/app/src/main/java/com/hanakonana/calculator/MainActivity.txt hanako_nana_calculator/app/src/main/java/com/hanakonana/calculator/MainActivity.java
          cp hanako_nana_calculator/app/src/main/assets/index.html.txt hanako_nana_calculator/app/src/main/assets/index.html
          cp hanako_nana_calculator/app/src/main/res/values/styles.xml.txt hanako_nana_calculator/app/src/main/res/values/styles.xml
          rm hanako_nana_calculator/app/src/main/res/values/styles.xml.txt
          rm hanako_nana_calculator/app/src/main/assets/index.html.txt
          rm hanako_nana_calculator/app/src/main/java/com/hanakonana/calculator/MainActivity.txt

      - name: Download Namuwiki card images
        shell: bash
        run: |
          set -euo pipefail
          OUT="hanako_nana_calculator/app/src/main/assets/cards"
          mkdir -p "$OUT"
          fetch_card() {
            local id="$1" hash="$2" ext="$3" filename="$4"
            local url="https://file.namu.moe/file/$hash"
            local out="$OUT/$id.$ext"
            local ok=0
            for attempt in 1 2 3; do
              if curl -fLsS --connect-timeout 8 --max-time 15 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" "$url" -o "$out"; then
                if [ "$(file --brief --mime-type "$out")" = "image/$ext" ]; then
                  ok=1
                  break
                fi
              fi
              rm -f "$out"
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              local filepage base
              filepage="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote("파일:"+sys.argv[1],safe=""))' "$filename")"
              for base in "https://namu.wiki/file/$filepage" "https://namu.moe/file/$filepage" "https://d.namu.moe/file/$filepage" "https://m.namu.moe/file/$filepage"; do
                if curl -fLsS --connect-timeout 8 --max-time 15 -A "Mozilla/5.0" "$base" -o "$out"; then
                  if [ "$(file --brief --mime-type "$out")" = "image/$ext" ]; then
                    ok=1
                    break
                  fi
                fi
                rm -f "$out"
              done
            fi
            if [ "$ok" -ne 1 ]; then
              local ref
              for ref in "https://d.namu.moe/" "https://namu.moe/" "https://namu.wiki/"; do
                if curl --http1.1 -fLsS --connect-timeout 8 --max-time 15 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" -e "$ref" -H "Origin: $ref" -H "Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8" "$url" -o "$out"; then
                  if [ "$(file --brief --mime-type "$out")" = "image/$ext" ]; then
                    ok=1
                    break
                  fi
                fi
                rm -f "$out"
              done
            fi
            if [ "$ok" -ne 1 ]; then
              local encoded proxy
              encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$url")"
              for proxy in \
                "https://proxy.cors.dev/$url" \
                "https://cors.tools/proxy?url=$encoded" \
                "https://i0.wp.com/file.namu.moe/file/$hash?ssl=1" \
                "https://images1-focus-opensocial.googleusercontent.com/gadgets/proxy?container=focus&url=$url" \
                "https://cors.isomorphic-git.org/$url" \
                "https://corsproxy.org/?$url" \
                "https://proxy.cors.sh/$url" \
                "https://images.weserv.nl/?url=$encoded" \
                "https://api.allorigins.win/raw?url=$encoded" \
                "https://api.codetabs.com/v1/proxy?quest=$encoded" \
                "https://corsproxy.io/?key=webdemo1&url=$encoded&reqHeaders=Referer%3Ahttps%3A%2F%2Fd.namu.moe%2F" \
                "https://wsrv.nl/?url=$encoded"; do
                for attempt in 1; do
                  if curl -fLsS --connect-timeout 8 --max-time 15 -A "Mozilla/5.0" "$proxy" -o "$out"; then
                    if [ "$(file --brief --mime-type "$out")" = "image/$ext" ]; then
                      ok=1
                      break 2
                    fi
                  fi
                  rm -f "$out"
                  sleep 2
                done
              done
            fi
            if [ "$ok" -ne 1 ] || [ ! -s "$out" ]; then
              echo "Failed to retrieve Namuwiki profile image: $id" >&2
              return 1
            fi
            local mime
            mime="$(file --brief --mime-type "$out")"
            if [ "$mime" != "image/$ext" ]; then
              echo "Unexpected image type for $id: $mime" >&2
              return 1
            fi
            echo "$id: $(stat -c%s "$out") bytes ($mime)"
          }
          fetch_card yuni f84a734831cf838bf2a83b96648a58743151259cf1bad327a4206978c0bd879a00e95e1d5510dd4cefd9ad50a7fbe8f559f94fd1a359dc73d332831bbb0693e1 png "아야츠노 유니 프로필_배경제거.png"
          fetch_card huya 823d076ce6f6331b17d1801583d8ec0554a0cbd5c915a8ced715b7543bd85e1b019587b76b6221109edd3b50c3bb027c png "사키하네 후야 프로필.png"
          fetch_card hina ff5574b04a725914e19f6a4c0de05612c9ea31a84873cd4dc4e1a75dd9c78be41674d9b9857479b7a3845892a201553c6314da0c63c58648e1e8bda0507b3759 png "시라유키 히나 프로필 고화질_배경제거.png"
          fetch_card mashiro e990a5d5aacf035e891e577e75ec8e36ad75be062dfff318d165440beacebc09a29a67ce278cc335edb0d2ef5f9b8ac13cb302492b1bdc13cbf777b55f895b63 png "네네코 마시로 프로필 고화질_배경제거.png"
          fetch_card lize 2f50cf78232e284d9db33490c13e026072a1fe8af00d5b102300cb2414fcd02d png "akane lize2.png"
          fetch_card tabi 022ca0d829ba3f4d66e82e76ef29403e5ed0639c9f878a0beeeeb119a7bed01443d8c6d78470ebdfe882e3491281d48466d86047d1b649f8b0c3deb17650b09a png "아라하시 타비 프로필 고화질_배경제거.png"
          fetch_card shibuki 1f4342ce520468afaec3c04466568953dce982fa73afdd98465f8a8452bd208bd58c7bd8af0f0f13f5cd907ace8a9adb png "텐코 시부키 프로필_고화질.png"
          fetch_card rin 5067c7ac12e6dd85a86747dcad75175b7cd14cd7ea8f5237baa931411c4ced73caa83bca9a34e63ca2ba1b8d3988cccf webp "아오쿠모 린 프로필.webp"
          fetch_card nana b013e71705f48aeee925df087afcb4c237e941c35acb67e52865924df755f8552b6a8f8ea7e4577924abba0f2f6b53c2 webp "하나코 나나 프로필.webp"
          fetch_card riko 4f8dd999dafc643e59ba30a4331eb13e302901fc625ea1d3a06fbe683ae745a3d727a87b62a48a408447a59f9b2764b7 webp "유즈하 리코 프로필.webp"
          fetch_card kanna 57812127deb97dddcc110ae370ab9612da74ad84a81b4e70f5ef954408c24961cf6802477d26bac67a33a53ea890ebc499302f975a7ca264287eb69a9c453bc7 png "아이리 칸나 공식 프로필_배경제거.png"

      - name: Build debug APK
        working-directory: hanako_nana_calculator
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanako-nana-calculator-debug-apk
          path: hanako_nana_calculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
