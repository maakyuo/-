name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        run: |
          tr -d '[:space:]' < project-source.zip.b64 | base64 --decode > project-source.zip
          unzip -q project-source.zip

      - name: Build debug APK
        working-directory: hanako_nana_calculator
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanako-nana-calculator-debug-apk
          path: hanako_nana_calculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
