name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        run: |
          python3 - <<'PY'
          import base64, io, zipfile
          raw = ''.join(open('project-source.zip.b64').read().split())
          def valid(data):
              try:
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      return z.testzip() is None
              except Exception:
                  return False
          data = None
          try:
              candidate = base64.b64decode(raw, validate=True)
              if valid(candidate):
                  data = candidate
          except Exception:
              pass
          if data is None:
              for i in range(len(raw) - 1):
                  try:
                      candidate = base64.b64decode(raw[:i] + raw[i+2:], validate=True)
                      if valid(candidate):
                          data = candidate
                          break
                  except Exception:
                      continue
          if data is None:
              raise SystemExit('Could not reconstruct the source ZIP')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              archive.extractall('.')
          PY

      - name: Build debug APK
        working-directory: hanako_nana_calculator
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanako-nana-calculator-debug-apk
          path: hanako_nana_calculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
