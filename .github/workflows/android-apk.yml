name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        run: |
          mkdir -p hanako_nana_calculator/app/src/main/assets
          mkdir -p hanako_nana_calculator/app/src/main/res/values
          cp hanako_nana_calculator/app/src/main/java/com/hanakonana/calculator/MainActivity.txt hanako_nana_calculator/app/src/main/java/com/hanakonana/calculator/MainActivity.java
          cp hanako_nana_calculator/app/src/main/assets/index.html.txt hanako_nana_calculator/app/src/main/assets/index.html
          cp hanako_nana_calculator/app/src/main/res/values/styles.xml.txt hanako_nana_calculator/app/src/main/res/values/styles.xml
          rm hanako_nana_calculator/app/src/main/res/values/styles.xml.txt
          rm hanako_nana_calculator/app/src/main/assets/index.html.txt
          rm hanako_nana_calculator/app/src/main/java/com/hanakonana/calculator/MainActivity.txt

      - name: Build debug APK
        working-directory: hanako_nana_calculator
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanako-nana-calculator-debug-apk
          path: hanako_nana_calculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
